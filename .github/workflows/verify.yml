name: Keycloak compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * 1'
permissions:
  contents: read
jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/github-script@v7
        id: versions
        with:
          script: |
            const versions = new Set(['26.8.1']);
            if (context.eventName === 'schedule' || context.eventName === 'workflow_dispatch') {
              const { data } = await github.rest.repos.getLatestRelease({owner: 'keycloak', repo: 'keycloak'});
              if (!/^\d+\.\d+\.\d+$/.test(data.tag_name)) throw new Error('Unexpected Keycloak release tag');
              versions.add(data.tag_name);
            }
            core.setOutput('matrix', JSON.stringify([...versions]));
  verify:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        keycloak: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test against matching Keycloak APIs
        run: mvn -B -ntp -Dkeycloak.version=${{ matrix.keycloak }} clean verify
      - name: Start matching Keycloak and check provider and mapper registration
        run: python3 scripts/smoke.py --version '${{ matrix.keycloak }}'
      - uses: actions/upload-artifact@v4
        with:
          name: keycloak-steam-provider-${{ matrix.keycloak }}
          path: |
            target/keycloak-steam-provider-*.jar
            target/surefire-reports/*.xml
          if-no-files-found: error
